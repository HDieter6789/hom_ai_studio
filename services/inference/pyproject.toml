[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hom-inference"
version = "0.1.0"
description = "vLLM-backed InferenceProvider adapter for H.O.M AI Studio"
requires-python = ">=3.11"
dependencies = [
    "hom-core",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["inference*"]
